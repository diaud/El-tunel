<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>El Paso de Piedra - Controles Móviles</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: monospace; user-select: none; touch-action: none; }
    
    #ui {
      position: absolute; bottom: 30px; width: 100%; text-align: center;
      color: #fff; font-size: 18px; pointer-events: none;
      text-shadow: 0 2px 8px rgba(0,0,0,0.95); letter-spacing: 1.5px;
      z-index: 10; padding: 0 10px; box-sizing: border-box;
    }
    
    #blocker, #pauseMenu {
      position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.85);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: white; font-size: 18px; line-height: 1.9; text-align: center;
      z-index: 20; padding: 20px; box-sizing: border-box;
    }
    #pauseMenu { display: none; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); }
    
    .menu-btn {
      background: rgba(162, 85, 255, 0.2); border: 2px solid #a255ff; color: #fff;
      padding: 12px 24px; margin: 10px; font-family: monospace; font-size: 18px;
      cursor: pointer; border-radius: 8px; transition: all 0.3s;
      text-transform: uppercase; letter-spacing: 2px;
    }
    .menu-btn:hover, .menu-btn:active { background: rgba(162, 85, 255, 0.6); box-shadow: 0 0 15px rgba(162, 85, 255, 0.8); }

    #endScreen {
      display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
      background: #000; color: #fff; z-index: 100; 
      flex-direction: column; align-items: center; justify-content: center; 
      font-family: Arial, sans-serif;
    }
    #endScreen h1 { font-size: 5rem; font-weight: normal; letter-spacing: 0.1em; margin: 0 0 30px 0; text-shadow: 0 0 20px #a255ff;}

    #warningScreen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.1s; z-index: 15; padding: 20px; box-sizing: border-box;
    }
    .warning-box {
      background: rgba(20, 0, 40, 0.6); border: 2px solid #a255ff;
      box-shadow: 0 0 30px rgba(162, 85, 255, 0.8), inset 0 0 20px rgba(162, 85, 255, 0.5);
      padding: 30px 50px; border-radius: 15px; text-align: center;
      font-family: Arial, sans-serif; text-transform: uppercase;
      transform: translateY(-50px); backdrop-filter: blur(4px);
    }
    .warning-box h2 { color: #ffbbbb; margin: 0; font-size: 28px; letter-spacing: 3px; text-shadow: 0 0 10px #ff0000; }
    .warning-box h1 { color: #ffffff; margin: 15px 0; font-size: 40px; text-shadow: 0 0 15px #a255ff; }
    .warning-box p { color: #ff5555; font-size: 14px; margin: 0; letter-spacing: 1px; line-height: 1.5; font-weight: bold;}

    /* Controles Táctiles (Móvil) */
    #mobilePauseBtn {
      display: none; position: absolute; top: 15px; right: 15px; z-index: 15;
      background: rgba(20, 0, 40, 0.6); border: 2px solid #a255ff; color: white;
      padding: 8px 15px; font-size: 20px; border-radius: 8px; cursor: pointer;
    }
    #mobileControls {
      display: none; position: absolute; bottom: 30px; left: 20px; z-index: 15;
      flex-direction: column; align-items: center;
    }
    .dpad-row { display: flex; justify-content: center; gap: 10px; margin-bottom: 10px; }
    .dpad-btn {
      width: 55px; height: 55px; background: rgba(20, 0, 40, 0.6);
      border: 2px solid #a255ff; border-radius: 12px; color: white;
      font-size: 24px; text-align: center; line-height: 50px; user-select: none;
      box-shadow: 0 0 15px rgba(162, 85, 255, 0.4); touch-action: none;
    }
    .dpad-btn:active { background: rgba(162, 85, 255, 0.8); box-shadow: 0 0 20px rgba(162, 85, 255, 0.9); }

    /* RESPONSIVIDAD MÓVIL */
    @media (max-width: 768px) {
      #ui { font-size: 14px; bottom: 20px; padding-bottom: 120px; /* Evitar solapamiento con controles */ }
      #blocker, #pauseMenu { font-size: 14px; }
      .menu-btn { font-size: 14px; padding: 10px 20px; }
      .warning-box { padding: 20px 30px; transform: translateY(-30px); }
      .warning-box h2 { font-size: 20px; }
      .warning-box h1 { font-size: 28px; }
      .warning-box p { font-size: 11px; }
      #endScreen h1 { font-size: 3.5rem; }
    }
  </style>
</head>
<body>
  <!-- PANTALLA INICIAL -->
  <div id="blocker">
    <span style="font-size: 24px; letter-spacing: 3px;"><b>EL TUNEL</b></span>
    <span style="font-size: 14px; opacity: 0.8; margin-top: 15px;">
      <span id="desktopText">Ratón para mirar. Usa W, A, S, D para caminar.<br><i>Presiona [ESC] en cualquier momento para pausar.</i></span>
      <span id="mobileText" style="display:none;">Usa las <b>flechas</b> en pantalla para moverte.<br>Desliza la pantalla libremente para mirar a tu alrededor.</span>
    </span>
    <button class="menu-btn" style="margin-top: 25px;" id="btnStart">Iniciar Viaje</button>
  </div>
  
  <!-- MENÚ DE PAUSA -->
  <div id="pauseMenu">
    <h2 style="letter-spacing: 5px; margin-bottom: 30px; font-size: 28px; font-family: Arial, sans-serif;">PAUSA</h2>
    <button class="menu-btn" id="btnResume">Reanudar</button>
    <button class="menu-btn" id="btnMute">Desactivar Audio</button>
    <button class="menu-btn" id="btnRestartPause">Reiniciar Bucle</button>
  </div>

  <div id="ui"></div>

  <!-- CONTROLES MÓVILES EN PANTALLA -->
  <button id="mobilePauseBtn">⏸</button>
  <div id="mobileControls">
    <div class="dpad-row">
      <div class="dpad-btn" id="btnW">▲</div>
    </div>
    <div class="dpad-row">
      <div class="dpad-btn" id="btnA">◀</div>
      <div class="dpad-btn" id="btnS">▼</div>
      <div class="dpad-btn" id="btnD">▶</div>
    </div>
  </div>
  
  <!-- UI DE ADVERTENCIA -->
  <div id="warningScreen">
    <div class="warning-box">
      <h2>⭙ Regrese ⭙</h2>
      <h1>Debe Volver<br>Al Camino</h1>
    </div>
  </div>

  <!-- PANTALLA FINAL -->
  <div id="endScreen">
    <h1>FIN</h1>
    <button class="menu-btn" id="btnRestartEnd">Volver a Jugar</button>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // Estados Globales del Juego
    let gameStarted = false;
    let gameEnded = false;
    let isMuted = false;
    let isEnding = false; 
    let endTimer = 0;     
    
    // Detección de Móvil
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || ('ontouchstart' in window);
    if (isMobile) {
        document.getElementById('mobileText').style.display = 'block';
        document.getElementById('desktopText').style.display = 'none';
    }

    const absorbables = []; 
    const initialStates = new Map(); 
    const warningUI = document.getElementById('warningScreen');

    // ==========================================
    // 0. MAPA DE TONOS Y AUDIO SINTÉTICO
    // ==========================================
    function createToneMap() {
      const canvas = document.createElement('canvas'); canvas.width = 3; canvas.height = 1; const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#666'; ctx.fillRect(0, 0, 1, 1); ctx.fillStyle = '#aaa'; ctx.fillRect(1, 0, 1, 1); ctx.fillStyle = '#fff'; ctx.fillRect(2, 0, 1, 1);
      const tex = new THREE.CanvasTexture(canvas); tex.minFilter = THREE.NearestFilter; tex.magFilter = THREE.NearestFilter; return tex;
    }
    const toonGradient = createToneMap();

    let audioCtx, masterGain, insectOsc, insectGain;
    
    function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      
      masterGain = audioCtx.createGain(); 
      masterGain.gain.value = isMuted ? 0 : 0.08; 
      
      const filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 400; 
      masterGain.connect(filter); filter.connect(audioCtx.destination);
      
      [1, 1.5, 2.0, 2.5].forEach(ratio => {
        const osc = audioCtx.createOscillator(); osc.type = 'sine'; osc.frequency.value = 98 * ratio;
        const lfo = audioCtx.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 0.05 + Math.random() * 0.05;
        const lfoGain = audioCtx.createGain(); lfoGain.gain.value = 0.5; lfo.connect(lfoGain.gain);
        const oscGain = audioCtx.createGain(); oscGain.gain.value = 0.6; osc.connect(oscGain); oscGain.connect(masterGain);
        lfo.start(); osc.start();
      });
    }

    function toggleAudio() {
        isMuted = !isMuted;
        document.getElementById('btnMute').innerText = isMuted ? "Activar Audio" : "Desactivar Audio";
        if (masterGain) masterGain.gain.value = isMuted ? 0 : 0.08;
        if (insectGain) insectGain.gain.value = isMuted ? 0 : 0.02;
    }

    function playStepSound(type) {
        if(!audioCtx || isMuted) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);

        if(type === 'human') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(120, now); osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
            gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if(type === 'cat') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(300, now); osc.frequency.exponentialRampToValueAtTime(200, now + 0.05);
            gain.gain.setValueAtTime(0.08, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
            osc.start(now); osc.stop(now + 0.05);
        } else if(type === 'lizard') {
            osc.type = 'square'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(900, now + 0.05);
            gain.gain.setValueAtTime(0.02, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
            osc.start(now); osc.stop(now + 0.05);
        }
    }

    function manageInsectSound(isActive) {
        if(!audioCtx) return;
        if(isActive) {
            if(!insectOsc) {
                insectOsc = audioCtx.createOscillator(); insectGain = audioCtx.createGain();
                insectOsc.type = 'sawtooth'; insectOsc.connect(insectGain); insectGain.connect(audioCtx.destination);
                insectGain.gain.value = isMuted ? 0 : 0.02; 
                insectOsc.start();
            }
            if(insectGain) insectGain.gain.value = isMuted ? 0 : 0.02;
            insectOsc.frequency.value = 250 + Math.sin(audioCtx.currentTime * 60) * 50;
        } else {
            if(insectOsc) { insectOsc.stop(); insectOsc = null; }
        }
    }

    // ==========================================
    // 1. TEXTURAS Y ESCENA
    // ==========================================
    function createVolcanicStoneTextures() {
      const size = 1024;
      const colorCanvas = document.createElement('canvas'), bumpCanvas = document.createElement('canvas');
      colorCanvas.width = bumpCanvas.width = size; colorCanvas.height = bumpCanvas.height = size;
      const cCtx = colorCanvas.getContext('2d'), bCtx = bumpCanvas.getContext('2d');
      cCtx.fillStyle = '#656059'; cCtx.fillRect(0, 0, size, size); bCtx.fillStyle = '#1a1a1a'; bCtx.fillRect(0, 0, size, size); 
      for (let i = 0; i < 50000; i++) {
        const c = 90 + Math.random() * 50; cCtx.fillStyle = `rgb(${c+5},${c},${c-10})`; cCtx.fillRect(Math.random() * size, Math.random() * size, 2, 2);
      }
      const rows = 16, cols = 14, rh = size / rows, rw = size / cols;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const cx = c * rw + rw / 2 + (Math.random() - 0.5) * 14, cy = r * rh + rh / 2 + (Math.random() - 0.5) * 14;
          const rx = rw * 0.44 + (Math.random() - 0.5) * 8, ry = rh * 0.44 + (Math.random() - 0.5) * 8;
          const tone = 30 + Math.floor(Math.random() * 45), warm = (Math.random() > 0.6) ? 8 : 0;
          cCtx.save(); cCtx.beginPath(); cCtx.ellipse(cx, cy, rx, ry, (Math.random() - 0.5) * 0.4, 0, Math.PI * 2);
          cCtx.fillStyle = `rgb(${tone + warm + 5}, ${tone + warm}, ${tone})`; cCtx.fill();
          for (let p = 0; p < 80; p++) {
            cCtx.fillStyle = (Math.random() > 0.5) ? '#101010' : '#5a554e'; cCtx.fillRect(cx + (Math.random() - 0.5) * rx * 1.5, cy + (Math.random() - 0.5) * ry * 1.5, 3, 3);
          }
          cCtx.restore();
          bCtx.save(); bCtx.beginPath(); bCtx.ellipse(cx, cy, rx - 2, ry - 2, (Math.random() - 0.5) * 0.4, 0, Math.PI * 2);
          bCtx.fillStyle = '#ffffff'; bCtx.fill(); bCtx.restore();
        }
      }
      const colorTex = new THREE.CanvasTexture(colorCanvas), bumpTex = new THREE.CanvasTexture(bumpCanvas);
      colorTex.wrapS = colorTex.wrapT = bumpTex.wrapS = bumpTex.wrapT = THREE.RepeatWrapping; return { colorTex, bumpTex };
    }

    const scene = new THREE.Scene(); scene.background = new THREE.Color(0x7fbaff); scene.fog = new THREE.Fog(0x7fbaff, 10, 100); 
    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.02, 500);
    const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
    renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; document.body.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0x9ad0ff, 0x4a5d3c, 0.4));
    const sunFront = new THREE.DirectionalLight(0xfff7ea, 4.0); sunFront.position.set(-35, 40, 55); 
    sunFront.castShadow = true; sunFront.shadow.mapSize.width = 1024; sunFront.shadow.mapSize.height = 1024;
    sunFront.shadow.camera.near = 0.5; sunFront.shadow.camera.far = 150;
    const d = 40; sunFront.shadow.camera.left = -d; sunFront.shadow.camera.right = d; sunFront.shadow.camera.top = d; sunFront.shadow.camera.bottom = -d;
    scene.add(sunFront);
    scene.add(new THREE.DirectionalLight(0xfffaee, 3.5).position.set(25, 40, -45));
    
    const playerLight = new THREE.PointLight(0xffffff, 0.8, 14); scene.add(playerLight);
    scene.add(new THREE.Mesh(new THREE.SphereGeometry(6, 32, 32), new THREE.MeshBasicMaterial({ color: 0xfff3cc })).position.copy(sunFront.position));

    const clouds = []; const cloudMat = new THREE.MeshToonMaterial({ color: 0xffffff, gradientMap: toonGradient });
    for(let i=0; i<15; i++) {
        const cGroup = new THREE.Group();
        for(let j=0; j<6; j++) {
            const puff = new THREE.Mesh(new THREE.SphereGeometry(2 + Math.random()*3, 16, 16), cloudMat);
            puff.position.set((Math.random()-0.5)*6, (Math.random()-0.5)*2, (Math.random()-0.5)*6); cGroup.add(puff);
        }
        cGroup.position.set((Math.random()-0.5)*180, 25 + Math.random()*15, (Math.random()-0.5)*180);
        scene.add(cGroup); clouds.push(cGroup);
    }

    // ==========================================
    // 3. TÚNEL Y COLISIONES FÍSICAS
    // ==========================================
    const { colorTex: stoneColor, bumpTex: stoneBump } = createVolcanicStoneTextures();
    const innerWallColor = stoneColor.clone(); innerWallColor.repeat.set(10, 1.5); const innerWallBump = stoneBump.clone(); innerWallBump.repeat.set(10, 1.5);
    const facadeColor = stoneColor.clone(); facadeColor.repeat.set(6, 4); const facadeBump = stoneBump.clone(); facadeBump.repeat.set(6, 4);

    const facadeMat = new THREE.MeshStandardMaterial({ map: facadeColor, bumpMap: facadeBump, bumpScale: 0.35, roughness: 0.9 });
    const innerMat = new THREE.MeshStandardMaterial({ map: innerWallColor, bumpMap: innerWallBump, bumpScale: 0.35, roughness: 0.9, side: THREE.DoubleSide });

    const road = new THREE.Mesh(new THREE.PlaneGeometry(6.5, 160), new THREE.MeshStandardMaterial({ color: 0x222225, roughness: 0.85 })); road.rotation.x = -Math.PI / 2; road.position.set(-0.8, 0, 0); road.receiveShadow = true; scene.add(road);
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshToonMaterial({ color: 0x5a7d36, gradientMap: toonGradient })); ground.rotation.x = -Math.PI / 2; ground.position.y = -0.1; ground.receiveShadow = true; scene.add(ground);

    absorbables.push(road, ground);

    const archRadius = 3.2, wallHeight = 2.2, tunnelLength = 40;
    const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(tunnelLength, wallHeight), innerMat); leftWall.rotation.y = Math.PI / 2; leftWall.position.set(-archRadius, wallHeight/2, 0); scene.add(leftWall);
    const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(tunnelLength, wallHeight), innerMat); rightWall.rotation.y = -Math.PI / 2; rightWall.position.set(archRadius, wallHeight/2, 0); scene.add(rightWall);
    const roofColor = stoneColor.clone(); roofColor.repeat.set(10, 3); const roofBump = stoneBump.clone(); roofBump.repeat.set(10, 3);
    const roofMat = new THREE.MeshStandardMaterial({ map: roofColor, bumpMap: roofBump, bumpScale: 0.35, roughness: 0.9, side: THREE.DoubleSide });
    const roof = new THREE.Mesh(new THREE.CylinderGeometry(archRadius, archRadius, tunnelLength, 32, 1, true, 0, Math.PI), roofMat); roof.rotation.x = -Math.PI / 2; roof.position.set(0, wallHeight, 0); scene.add(roof);

    const mShape = new THREE.Shape();
    mShape.moveTo(-20, 0); mShape.lineTo(20, 0); mShape.lineTo(20, 12); mShape.lineTo(-20, 12); mShape.lineTo(-20, 0);
    const mHole = new THREE.Path();
    mHole.moveTo(-3.25, 0); mHole.lineTo(3.25, 0); mHole.lineTo(3.25, 2.25); mHole.absarc(0, 2.25, 3.25, 0, Math.PI, false); mHole.lineTo(-3.25, 2.25); mHole.lineTo(-3.25, 0); mShape.holes.push(mHole);
    const mountain = new THREE.Mesh(new THREE.ExtrudeGeometry(mShape, { depth: tunnelLength, bevelEnabled: false }), facadeMat); mountain.position.set(0, 0, -tunnelLength/2); mountain.castShadow = true; mountain.receiveShadow = true; scene.add(mountain);
    const topGrass = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshToonMaterial({ color: 0x4a6e26, gradientMap: toonGradient })); topGrass.rotation.x = -Math.PI / 2; topGrass.position.set(0, 12.01, 0); topGrass.receiveShadow = true; scene.add(topGrass);

    absorbables.push(leftWall, rightWall, roof, mountain, topGrass);

    const colliders = [];
    function checkCollision(nx, nz, radius = 0.4) {
      if (nz > -20.5 && nz < 20.5 && (nx > 2.8 || nx < -2.8)) return true;
      if (nz > 20 && nz < 21 && Math.abs(nx) > 3.2) return true;
      if (nz < -20 && nz > -21 && Math.abs(nx) > 3.2) return true;
      for (let c of colliders) { if (nx > c.minX - radius && nx < c.maxX + radius && nz > c.minZ - radius && nz < c.maxZ + radius) return true; }
      return false;
    }

    // ==========================================
    // 4. ÁRBOLES Y PUEBLO
    // ==========================================
    const woodMat = new THREE.MeshToonMaterial({ color: 0x4e342e, gradientMap: toonGradient });
    const leafMat = new THREE.MeshToonMaterial({ color: 0x388e3c, gradientMap: toonGradient });
    
    function createTree(x, z, onTop = false) {
      const tree = new THREE.Group();
      const tHeight = 1.5 + Math.random() * 2.0;
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, tHeight, 7), woodMat); trunk.position.y = tHeight / 2; trunk.castShadow = true; tree.add(trunk);
      const numBranches = 2 + Math.floor(Math.random() * 3);
      for(let i=0; i<numBranches; i++) {
          const bh = 1.0 + Math.random();
          const branch = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.15, bh, 5), woodMat);
          branch.position.y = tHeight * 0.4 + Math.random() * (tHeight * 0.4); branch.rotation.z = 0.4 + Math.random() * 0.4; branch.rotation.y = (Math.PI * 2 / numBranches) * i + Math.random(); branch.translateY(bh/2); branch.castShadow = true;
          const leaves = new THREE.Mesh(new THREE.DodecahedronGeometry(1.0 + Math.random()*0.5), leafMat); leaves.position.set(0, bh/2, 0); leaves.castShadow = true; branch.add(leaves); tree.add(branch);
      }
      const topLeaves = new THREE.Mesh(new THREE.DodecahedronGeometry(1.5 + Math.random()), leafMat); topLeaves.position.y = tHeight; topLeaves.castShadow = true; tree.add(topLeaves);
      tree.position.set(x, onTop ? 12 : 0, z); scene.add(tree);
      if(!onTop) colliders.push({ minX: x - 0.5, maxX: x + 0.5, minZ: z - 0.5, maxZ: z + 0.5 });
      absorbables.push(tree);
    }

    createTree(3.5, 27.5, false);

    const houseColors = [0xf5f5f5, 0xeaeaea, 0xfaeedd, 0xfffcf5];
    for (let i = 0; i < 50; i++) {
      let x = (Math.random() - 0.5) * 140, z = (Math.random() > 0.5 ? 1 : -1) * (25 + Math.random() * 60);
      if (Math.abs(x) < 8) continue; 
      const house = new THREE.Group();
      const width = 3+Math.random()*2, h = 3+Math.random()*3, depth = 3+Math.random()*2;
      const body = new THREE.Mesh(new THREE.BoxGeometry(width, h, depth), new THREE.MeshStandardMaterial({ color: houseColors[Math.floor(Math.random()*houseColors.length)], roughness: 0.9 })); body.position.y = h/2; body.castShadow = true; body.receiveShadow = true;
      const roof = new THREE.Mesh(new THREE.ConeGeometry(width*0.8, 1.5, 4), new THREE.MeshStandardMaterial({ color: 0x8b3a20, roughness: 0.9 })); roof.position.y = h + 0.75; roof.rotation.y = Math.PI / 4; roof.castShadow = true;
      house.add(body, roof); house.position.set(x, 0, z); scene.add(house);
      colliders.push({ minX: x - width/2, maxX: x + width/2, minZ: z - depth/2, maxZ: z + depth/2 });
      absorbables.push(house);
    }

    for (let i = 0; i < 150; i++) {
      let x = (Math.random() - 0.5) * 120, z = (Math.random() - 0.5) * 160;
      if (Math.abs(x) < 6 || (Math.abs(x - 3.5) < 2 && Math.abs(z - 27.5) < 2)) continue; 
      createTree(x, z, (Math.abs(z) < 20 && Math.abs(x) < 20));
    }

    const clock = new THREE.Clock(); let lastStep = 0;
    
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta(), time = clock.getElapsedTime();

      if (isEnding) {
        endTimer += delta;
        if (cosmicBlackHole.scale.x < 15) cosmicBlackHole.scale.addScalar(delta * 1.5);
        
        bhRing1.rotation.x += delta * 8; bhRing1.rotation.y += delta * 10;
        bhRing2.rotation.x -= delta * 6; bhRing2.rotation.y -= delta * 12;

        const bhPos = cosmicBlackHole.position; let allSucked = true;

                if (obj && obj.scale.x > 0.01) {
                    allSucked = false;
                    const dist = obj.position.distanceTo(bhPos);
                    const speed = Math.max(0.5, 15 / (dist + 1)) * delta;

                    obj.rotation.x += delta; obj.rotation.y += delta * 2;
                }
            });

                }
            });
        }

        camera.position.lerp(new THREE.Vector3(entities.human.position.x, entities.human.position.y + 4, entities.human.position.z + 12), delta * 0.5);
        camera.lookAt(entities.human.position.x, entities.human.position.y + 2, entities.human.position.z);

            if(!gameEnded) {
                gameEnded = true; isLocked = false;
                if(!isMobile) document.exitPointerLock(); 
                document.getElementById('mobilePauseBtn').style.display = 'none';
                if(isMobile) document.getElementById('mobileControls').style.display = 'none';
                document.getElementById('endScreen').style.display = 'flex';
                document.getElementById('ui').style.display = 'none';
            }
        }
        renderer.render(scene, camera); return; 
      }

      clouds.forEach(c => { c.position.x += delta * 1.5; if (c.position.x > 150) c.position.x = -150; });
      bulbLight.intensity = 4.0 * (Math.sin(time * 28) * Math.cos(time * 11) > 0.35 ? 0.2 : 1.0) * (Math.random() > 0.95 ? 0.1 : 1.0);

      pRing1.rotation.x += delta * 2; pRing1.rotation.y += delta * 3.5;
      pRing2.rotation.x -= delta * 1.5; pRing2.rotation.y -= delta * 4;

      if (isLocked) {
        const state = LOOPS[currentLoop], activeObj = entities[state.id];
        let moved = false; let isBeingSucked = false;

        manageInsectSound(state.id === 'insect');

        if (state.id !== 'stone' && !isEnding) {
            const distToPortal = activeObj.position.distanceTo(tunnelPortalGroup.position);
            const eventHorizon = 12.0; 

            if (distToPortal < eventHorizon) {
                let s = 1.0 + (1.0 - (distToPortal / eventHorizon)) * 1.5; 
                tunnelPortalGroup.scale.lerp(new THREE.Vector3(s, s, s), delta * 5);
                const pullForce = Math.pow((1.0 - (distToPortal / eventHorizon)), 2) * 5.0; 
                const pullDir = tunnelPortalGroup.position.clone().sub(activeObj.position).normalize();
                activeObj.position.add(pullDir.multiplyScalar(pullForce * delta));
                activeObj.rotation.z += pullDir.x * delta * pullForce; 
            } else {
                tunnelPortalGroup.scale.lerp(new THREE.Vector3(0.05, 0.05, 0.05), delta * 2);
            }

            if (distToPortal < 2.5 || activeObj.position.z < -18.0) {
                isBeingSucked = true; 
                activeObj.position.lerp(tunnelPortalGroup.position, delta * 3.0); 
                activeObj.scale.lerp(new THREE.Vector3(0.01, 0.01, 0.01), delta * 4.0);
                activeObj.rotation.x += delta * 15; activeObj.rotation.y += delta * 20;

                if (distToPortal < 0.5) { setupLoop((currentLoop + 1) % LOOPS.length); return; }
            }
        }

        if (!isEnding && state.id !== 'stone') {
            const BOUNDARY_X = 35, BOUNDARY_Z_MAX = 35, WARNING_DIST = 8; 
            const absX = Math.abs(activeObj.position.x), z = activeObj.position.z;

            if (absX > BOUNDARY_X || z > BOUNDARY_Z_MAX) { setupLoop(currentLoop); return; }

            let warningLevel = 0;
            if (absX > BOUNDARY_X - WARNING_DIST) warningLevel = Math.max(warningLevel, (absX - (BOUNDARY_X - WARNING_DIST)) / WARNING_DIST);
            if (z > BOUNDARY_Z_MAX - WARNING_DIST) warningLevel = Math.max(warningLevel, (z - (BOUNDARY_Z_MAX - WARNING_DIST)) / WARNING_DIST);
            warningUI.style.opacity = warningLevel > 0 ? warningLevel.toString() : '0';
        }

        if (state.speed > 0 && !isBeingSucked) {
            if (state.id === 'lizard') {
                const dir = new THREE.Vector3(0, 0, -1); dir.applyEuler(new THREE.Euler(camPitch, camYaw, 0, 'YXZ')); 
                const right = new THREE.Vector3(Math.cos(camYaw), 0, -Math.sin(camYaw));
                let moveX = 0, moveZ = 0;
                let isW = keys['KeyW'] || keys['ArrowUp'], isS = keys['KeyS'] || keys['ArrowDown'];
                let isA = keys['KeyA'] || keys['ArrowLeft'], isD = keys['KeyD'] || keys['ArrowRight'];

                if (isW) { moveX += dir.x * state.speed * delta; moveZ += dir.z * state.speed * delta; moved = true; }
                if (isS) { moveX -= dir.x * state.speed * delta; moveZ -= dir.z * state.speed * delta; moved = true; }
                if (isA) { moveX -= right.x * state.speed * 0.7 * delta; moveZ -= right.z * state.speed * 0.7 * delta; moved = true; }
                if (isD) { moveX += right.x * state.speed * 0.7 * delta; moveZ += right.z * state.speed * 0.7 * delta; moved = true; }

                let nextX = activeObj.position.x + moveX, nextZ = activeObj.position.z + moveZ;
                let isHitting = checkCollision(nextX, nextZ, 0.35);

                if (activeObj.position.y > 0.05) {
                    let verticalMove = 0;
                    if (isW) verticalMove = -camPitch * state.speed * delta * 1.5;
                    if (isS) verticalMove = camPitch * state.speed * delta * 1.5;
                    if (Math.abs(camPitch) < 0.3 && isW) verticalMove = state.speed * delta;
                    activeObj.position.y += verticalMove;
                    if (!isHitting && (isA || isD || isS)) { activeObj.position.x = nextX; activeObj.position.z = nextZ; activeObj.position.y -= state.speed * delta * 2; }
                    if (activeObj.position.y <= 0.04) { activeObj.position.y = 0.04; activeObj.rotation.x = 0; } 
                    else { if (verticalMove > 0.01) activeObj.rotation.x = -Math.PI / 2.2; else if (verticalMove < -0.01) activeObj.rotation.x = Math.PI / 2.2; }
                } else {
                    if (isHitting && isW) { activeObj.position.y += state.speed * delta * 2; activeObj.rotation.x = -Math.PI / 2; } 
                    else {
                        if (!checkCollision(activeObj.position.x + moveX, activeObj.position.z, 0.35)) activeObj.position.x += moveX;
                        if (!checkCollision(activeObj.position.x, activeObj.position.z + moveZ, 0.35)) activeObj.position.z += moveZ;
                        activeObj.rotation.x = 0;
                    }
                    activeObj.position.y = 0.04;
                }
                if (moved) activeObj.rotation.y = camYaw;
            } else {
                const forward = new THREE.Vector3(-Math.sin(camYaw), 0, -Math.cos(camYaw));
                const right = new THREE.Vector3(Math.cos(camYaw), 0, -Math.sin(camYaw));
                let moveX = 0, moveZ = 0;
                if (keys['KeyW'] || keys['ArrowUp']) { moveX += forward.x * state.speed * delta; moveZ += forward.z * state.speed * delta; moved = true; }
                if (keys['KeyS'] || keys['ArrowDown']) { moveX -= forward.x * state.speed * delta; moveZ -= forward.z * state.speed * delta; moved = true; }
                if (keys['KeyA'] || keys['ArrowLeft']) { moveX -= right.x * state.speed * 0.7 * delta; moveZ -= right.z * state.speed * 0.7 * delta; moved = true; }
                if (keys['KeyD'] || keys['ArrowRight']) { moveX += right.x * state.speed * 0.7 * delta; moveZ += right.z * state.speed * 0.7 * delta; moved = true; }
                
                if (moved) {
                  if (!checkCollision(activeObj.position.x + moveX, activeObj.position.z)) activeObj.position.x += moveX;
                  if (!checkCollision(activeObj.position.x, activeObj.position.z + moveZ)) activeObj.position.z += moveZ;
                  activeObj.rotation.y = camYaw;
                }
            }
        }

        if(moved) {
            const freqMap = { 'human': 3.0, 'cat': 3.5, 'lizard': 7.0 }; const freq = freqMap[state.id] || 0;
            if(freq > 0) {
                const stepCycle = Math.floor(time * freq);
                if(stepCycle !== lastStep) { lastStep = stepCycle; playStepSound(state.id); }
            }
        }

        playerLight.position.copy(activeObj.position); playerLight.position.y += state.camH; 

        if (state.id === 'human' && moved && !isBeingSucked) {
          animParts.human.legL.rotation.x = Math.sin(time * 9) * 0.6; animParts.human.legR.rotation.x = -Math.sin(time * 9) * 0.6;
          animParts.human.armL.rotation.x = -Math.sin(time * 9) * 0.5; animParts.human.armR.rotation.x = Math.sin(time * 9) * 0.5;
        } else if (state.id === 'human' && !isBeingSucked) {
          animParts.human.legL.rotation.x = animParts.human.legR.rotation.x = animParts.human.armL.rotation.x = animParts.human.armR.rotation.x = 0;
        }

        if (state.id === 'cat' && !isBeingSucked) {
            if (moved) {
                const walkSpeed = time * 7; 
                animParts.cat.cLegFL.rotation.x = Math.sin(walkSpeed) * 0.6; animParts.cat.cLegBR.rotation.x = Math.sin(walkSpeed) * 0.6;
                animParts.cat.cLegFR.rotation.x = Math.sin(walkSpeed + Math.PI) * 0.6; animParts.cat.cLegBL.rotation.x = Math.sin(walkSpeed + Math.PI) * 0.6;
                animParts.cat.cBody.rotation.z = Math.sin(walkSpeed * 0.5) * 0.15; animParts.cat.cBody.rotation.y = Math.sin(walkSpeed * 0.5) * 0.1;
                animParts.cat.cHead.rotation.z = -animParts.cat.cBody.rotation.z; animParts.cat.tailPivot.rotation.z = Math.sin(walkSpeed) * 0.4;
            } else {
                animParts.cat.cLegFL.rotation.x = animParts.cat.cLegFR.rotation.x = animParts.cat.cLegBL.rotation.x = animParts.cat.cLegBR.rotation.x = 0;
                animParts.cat.cBody.rotation.z = animParts.cat.cBody.rotation.y = 0;
                animParts.cat.cHead.rotation.z = Math.sin(time * 2) * 0.05; animParts.cat.tailPivot.rotation.z = Math.sin(time * 3) * 0.2;
            }
        }

        if (state.id === 'lizard' && !isBeingSucked) {
            if (moved) {
                const lizSpeed = time * 18;
                animParts.lizard.lBody.rotation.y = Math.sin(lizSpeed) * 0.2; animParts.lizard.lTailPivot.rotation.y = -Math.sin(lizSpeed) * 0.4;
                animParts.lizard.lHeadPivot.rotation.y = -Math.sin(lizSpeed) * 0.2;
                animParts.lizard.lLegFL.rotation.y = Math.sin(lizSpeed) * 0.6; animParts.lizard.lLegBR.rotation.y = Math.sin(lizSpeed) * 0.6;
                animParts.lizard.lLegFR.rotation.y = Math.sin(lizSpeed + Math.PI) * 0.6; animParts.lizard.lLegBL.rotation.y = Math.sin(lizSpeed + Math.PI) * 0.6;
            } else {
                animParts.lizard.lBody.rotation.y = animParts.lizard.lHeadPivot.rotation.y = 0; animParts.lizard.lTailPivot.rotation.y = Math.sin(time * 3) * 0.15; 
                animParts.lizard.lLegFL.rotation.y = animParts.lizard.lLegFR.rotation.y = animParts.lizard.lLegBL.rotation.y = animParts.lizard.lLegBR.rotation.y = 0;
            }
            const tCycle = time % 3;
            if (tCycle < 0.08) animParts.lizard.lTongue.scale.y = tCycle * 12; else if (tCycle < 0.15) animParts.lizard.lTongue.scale.y = 1; 
            else if (tCycle < 0.23) animParts.lizard.lTongue.scale.y = (0.23 - tCycle) * 12; else animParts.lizard.lTongue.scale.y = 0.001;
        } else if (state.id === 'lizard') { animParts.lizard.lTailPivot.rotation.y = Math.sin(time * 3) * 0.15; animParts.lizard.lTongue.scale.y = 0.001; }

        if (!isBeingSucked) {
            animParts.insect.iWingL.rotation.z = Math.sin(time * 55) * 0.6; animParts.insect.iWingR.rotation.z = -Math.sin(time * 55) * 0.6;
            if (state.id !== 'insect') entities.insect.position.set(Math.sin(time * 2.5) * 0.8, 3.4 + Math.cos(time * 3) * 0.2, Math.sin(time * 3.5) * 0.8);
        }

        if (state.id === 'stone') { state.timer += delta; if (state.timer > 6) setupLoop((currentLoop + 1) % LOOPS.length); }

        const targetCamPosition = new THREE.Vector3(
          activeObj.position.x + state.camDist * Math.cos(camPitch) * Math.sin(camYaw),
          Math.max(0.04, activeObj.position.y + state.camDist * Math.sin(camPitch) + state.camH),
          activeObj.position.z + state.camDist * Math.cos(camPitch) * Math.cos(camYaw)
        );
        camera.position.lerp(targetCamPosition, 5.0 * delta);
        camera.lookAt(activeObj.position.x, activeObj.position.y + state.camH * 0.6, activeObj.position.z);
      }
      renderer.render(scene, camera);
    }
    animate();
    window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
  </script>
</body>
</html>
